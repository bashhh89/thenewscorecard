<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test SeekPDF Generation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background-color: #103138;
            color: #20E28F;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background-color: #0F2A30;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test SeekPDF Generation</h1>
    
    <button onclick="testSeekPDF()">Test SeekPDF API</button>
    
    <div id="status"></div>
    
    <script>
        async function testSeekPDF() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status">Testing PDF generation...</div>';
            
            const testData = {
                UserInformation: {
                    UserName: 'Test User',
                    CompanyName: 'Test Company',
                    Email: 'test@example.com',
                    Industry: 'Technology'
                },
                ScoreInformation: {
                    AITier: 'Leader',
                    FinalScore: 85,
                    ReportID: 'test-123'
                },
                FullReportMarkdown: `# AI Efficiency Scorecard Report

## Overall Tier: Leader

You are at the **Leader** tier of AI maturity.
Final Score: 85/100

## Key Findings

### Strengths
- Strong AI implementation
- Good data governance
- Excellent team skills

### Areas for Improvement
- Need more automation
- Better integration required
- Scale AI initiatives

## Recommendations
1. Expand AI usage across departments
2. Invest in advanced AI tools
3. Build AI center of excellence
`,
                questionAnswerHistory: [],
                strengths: ['Strong AI implementation', 'Good data governance'],
                weaknesses: ['Need more automation', 'Better integration required'],
                actionItems: ['Expand AI usage', 'Invest in tools', 'Build CoE']
            };
            
            try {
                console.log('Sending request to /api/seek-pdf...');
                const response = await fetch('/api/seek-pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData),
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error: ${errorText}`);
                }
                
                const blob = await response.blob();
                console.log('PDF blob size:', blob.size, 'bytes');
                console.log('PDF blob type:', blob.type);
                
                // Download the PDF
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `seek-test-${Date.now()}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                statusDiv.innerHTML = `
                    <div class="status success">
                        <h3>✓ PDF Generated Successfully!</h3>
                        <p>File size: ${blob.size} bytes</p>
                        <p>Content type: ${blob.type}</p>
                        <p>The PDF has been downloaded to your Downloads folder.</p>
                    </div>
                `;
                
            } catch (error) {
                console.error('Test failed:', error);
                statusDiv.innerHTML = `
                    <div class="status error">
                        <h3>✗ PDF Generation Failed</h3>
                        <p>Error: ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
