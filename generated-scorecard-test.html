<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Efficiency Scorecard - John Smith at TechCorp Inc</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    @page {
      size: A4;
      margin: 1.5cm 2cm;
      @bottom-center {
        content: "Page " counter(page) " of " counter(pages);
        font-family: 'Inter', sans-serif;
        font-size: 10pt;
        color: #6b7280;
        margin-top: 1cm;
      }
      @bottom-right {
        content: "© 2024 AI Efficiency Report";
        font-family: 'Inter', sans-serif;
        font-size: 9pt;
        color: #9ca3af;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      color: #1f2937;
      background: #ffffff;
      font-size: 11pt;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Professional Color Palette */
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --secondary: #0f172a;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
    }

    /* Modern Header Design */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 2rem 2.5rem;
      margin: -1.5cm -2cm 2rem -2cm;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      transform: translate(50%, -50%);
    }

    .header-content {
      position: relative;
      z-index: 2;
    }

    .logo-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .logo-placeholder {
      background: rgba(255, 255, 255, 0.2);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      color: rgba(255, 255, 255, 0.8);
      font-size: 10pt;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .report-date {
      color: rgba(255, 255, 255, 0.8);
      font-size: 11pt;
      font-weight: 400;
    }

    .report-title {
      font-size: 36pt;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5pt;
    }

    .report-subtitle {
      font-size: 16pt;
      font-weight: 400;
      opacity: 0.9;
    }

    /* Modern Card System */
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--gray-200);
      margin-bottom: 1.5rem;
      overflow: hidden;
      page-break-inside: avoid;
    }

    .card-header {
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      padding: 1.25rem 1.5rem;
    }

    .card-title {
      font-size: 16pt;
      font-weight: 600;
      color: var(--secondary);
      margin: 0;
    }

    .card-body {
      padding: 1.5rem;
    }

    /* Grid System */
    .grid {
      display: grid;
      gap: 1.5rem;
    }

    .grid-2 {
      grid-template-columns: 1fr 1fr;
    }

    /* Info Rows */
    .info-grid {
      display: grid;
      gap: 1rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--gray-100);
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 500;
      color: var(--gray-600);
      min-width: 120px;
      font-size: 10pt;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-weight: 600;
      color: var(--gray-800);
      font-size: 12pt;
    }

    /* Maturity Tier Highlight */
    .maturity-showcase {
      background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
      color: white;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .maturity-showcase::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .maturity-label {
      font-size: 12pt;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .maturity-value {
      font-size: 32pt;
      font-weight: 700;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 2;
    }

    .maturity-score {
      font-size: 14pt;
      font-weight: 500;
      opacity: 0.9;
      position: relative;
      z-index: 2;
    }

    /* Section Headers */
    .section {
      margin: 2rem 0;
      page-break-inside: avoid;
    }

    .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 3px solid var(--primary);
    }

    .section-title {
      font-size: 22pt;
      font-weight: 700;
      color: var(--secondary);
      margin: 0;
    }

    .section-icon {
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 6px;
      margin-right: 1rem;
    }

    /* Q&A Section */
    .qa-section {
      margin-top: 2rem;
      page-break-before: always;
    }

    .qa-item {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      margin-bottom: 1rem;
      padding: 1rem;
    }

    .qa-question {
      font-weight: 600;
      color: var(--gray-800);
      margin-bottom: 0.5rem;
    }

    .qa-answer {
      color: var(--gray-700);
      line-height: 1.6;
    }

    /* Page Breaks */
    .page-break {
      page-break-before: always;
    }

    .avoid-break {
      page-break-inside: avoid;
    }

    /* Full Report Section */
    .full-report-section {
      margin: 2rem 0;
    }

    .full-report-section h1,
    .full-report-section h2 {
      font-size: 18pt;
      color: var(--primary);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary);
    }

    .full-report-section h3 {
      font-size: 16pt;
      color: var(--secondary);
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .full-report-section h4 {
      font-size: 14pt;
      color: var(--gray-800);
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .full-report-section ul {
      list-style-type: disc;
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .full-report-section li {
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .full-report-section p {
      margin-bottom: 1rem;
      line-height: 1.6;
      color: var(--gray-700);
    }

    .full-report-section strong {
      color: var(--gray-800);
      font-weight: 600;
    }
</head>

  <div class="container">
    <!-- Professional Header -->

    <div class="card avoid-break">

            </div>
          </div>
          <div>
            <div class="maturity-showcase">

<h2>Your Personalized AI Learning Path</h2>

          </div>
        </div>
      </div>
    </section>

    <!-- Question & Answer History -->
